version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agentflow_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./hasura/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  graphql-engine:
    image: hasura/graphql-engine:v2.33.0
    container_name: agentflow_hasura
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      ACTION_HANDLER_URL: http://app:3000

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentflow_nextjs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - graphql-engine

volumes:
  pgdata:
